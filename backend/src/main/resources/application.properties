spring.datasource.url=jdbc:postgresql://localhost:5432/zestdb
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# Flyway migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
server.port=8081
app.jwt.secret=ChangeThisSecretToSomethingLongAndRandomWhichIsAtLeast256bitsLongChangeMe!
app.jwt.expiration-minutes=60
app.stripe.secret=
app.stripe.webhook-secret=
app.payos.enabled=false
app.payos.client-id=
app.payos.api-key=
app.payos.checksum-key=
app.payos.base-url=
app.allowed-origins=http://localhost:3000
